<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maqsat — тесты</title>
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
  <main>
    <section class="card">
      <h1>Тесты Maqsat</h1>
      <p class="muted">Целостность базы, проверка условий, обратное планирование, календарь. «Сегодня» зафиксировано: 26.09.2026.</p>
      <p id="sum"></p>
      <ul class="tests" id="tests"></ul>
    </section>
  </main>
  <script src="js/data.js?v=1"></script>
  <script src="js/engine.js?v=1"></script>
  <script src="js/tests.js?v=1"></script>
  <script>
    const results = M.runTests();
    const out = document.getElementById('tests');
    const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    out.innerHTML = results.map(r => `<li class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✓' : '✗'} ${esc(r.name)}${r.err ? ' — ' + esc(r.err) : ''}</li>`).join('');
    document.getElementById('sum').innerHTML = `<b>${results.filter(r => r.ok).length} из ${results.length}</b> тестов прошли`;
    window.TEST_RESULTS = results;
  </script>
</body>
</html>
